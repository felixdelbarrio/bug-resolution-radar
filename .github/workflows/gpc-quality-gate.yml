name: GPC Quality Gate

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpc-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpc-quality:
    name: GPC contract, Apps Script and local WebApp
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run GPC quality gate
        run: make ci-gpc VENV="$(python -c 'import sys; print(sys.prefix)')"
