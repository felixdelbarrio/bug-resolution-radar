name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "25 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Keep CI green when repository-level Code Scanning is disabled.
          # Results are still generated and published as workflow artifacts.
          # Switch to `upload: always` after enabling Code Scanning in repo settings.
          upload: never
          output: sarif-results

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v6
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: error
