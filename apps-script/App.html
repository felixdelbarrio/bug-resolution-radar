<script>
const RPC = (() => {
  const call = (name, ...args) => new Promise((resolve, reject) => {
    const startedAt = performance.now();
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.ok) {
          if (name !== 'recordAnalyticsEvents' && window.__RADAR_TELEMETRY__) {
            window.__RADAR_TELEMETRY__('rpc', {
              name: name
            }, Math.round(performance.now() - startedAt), 'success');
          }
          resolve(response.data);
          return;
        }
        const error = new Error(
          response && response.error ? response.error.message : 'Respuesta no válida.'
        );
        error.code = response && response.error ? response.error.code : 'INVALID_RESPONSE';
        if (name !== 'recordAnalyticsEvents' && window.__RADAR_TELEMETRY__) {
          window.__RADAR_TELEMETRY__('rpc', {
            name: name, code: error.code
          }, Math.round(performance.now() - startedAt), 'error');
        }
        reject(error);
      })
      .withFailureHandler(error => {
        const failure = new Error(
          error && error.message
            ? error.message
            : 'Apps Script interrumpió la solicitud. Recarga la aplicación.'
        );
        failure.code = 'APPS_SCRIPT_FAILURE';
        if (name !== 'recordAnalyticsEvents' && window.__RADAR_TELEMETRY__) {
          window.__RADAR_TELEMETRY__('rpc', {
            name: name, code: failure.code
          }, Math.round(performance.now() - startedAt), 'error');
        }
        reject(failure);
      })[name](...args);
  });
  return { call };
})();

const App = (() => {
  const state = {
    route: 'dashboard',
    panel: 'overview',
    bootstrap: null,
    dashboard: null,
    scopeKey: '',
    trendChart: 'open_status_bar',
    insightsId: 'summary',
    issuesView: 'Cards',
    page: 1,
    pageSize: 50,
    dark: false,
    sharedToken: String(window.__RADAR_SHARE_TOKEN__ || ''),
    pending: 0,
    memory: new Map(),
    inFlight: new Map(),
    preferenceTimer: null,
    lastPreferenceSignature: '',
    transferValidation: null,
    lastPeriodReport: null,
    newsletterSettings: null,
    newsletterReportId: '',
    settingsTab: 'health',
    adminConsole: null,
    analyticsReport: null,
    analyticsUserEmail: '',
    analyticsDays: 30,
    drivePickerConfig: null,
    duplicateMode: 'title',
    analyticsQueue: [],
    analyticsTimer: null,
    navigationEpoch: 0,
    sessionId: window.crypto && window.crypto.randomUUID
      ? window.crypto.randomUUID()
      : `session-${Date.now()}-${Math.random().toString(16).slice(2)}`
  };

  const $ = id => document.getElementById(id);
  const REQUIRED_SHELL_IDS = Object.freeze([
    'accessGateMessage',
    'accessGateRetry',
    'app',
    'appTitle',
    'dataVersion',
    'errorView',
    'loadingView',
    'retryButton',
    'routeView',
    'scopeBar',
    'scopeDescription',
    'sharedScopeBanner',
    'themeToggle',
    'workspaceCountry',
    'workspaceRollup',
    'workspaceRollupCaption',
    'workspaceSource'
  ]);
  const view = () => $('routeView');
  const isShared = () => Boolean(state.sharedToken);
  const isAdmin = () => Boolean(
    state.bootstrap && state.bootstrap.user && state.bootstrap.user.role === 'admin'
  );
  const currentScope = () => (state.bootstrap.scopes || []).find(
    scope => scope.scopeKey === state.scopeKey
  ) || null;

  function assertShellContract() {
    const missing = REQUIRED_SHELL_IDS.filter(id => !$(id));
    if (!missing.length) return;
    const error = new Error(
      `Despliegue GPC incompleto: faltan ${missing.map(id => `#${id}`).join(', ')}. ` +
      'Publica una versión nueva incluyendo todos los archivos HTML.'
    );
    error.code = 'WEBAPP_SHELL_MISMATCH';
    throw error;
  }

  function showAccessError(error) {
    document.body.className = 'auth-denied';
    const message = $('accessGateMessage');
    const retry = $('accessGateRetry');
    if (message) {
      message.textContent = error && error.message
        ? error.message
        : 'No se pudo iniciar la WebApp.';
    }
    if (retry) retry.classList.remove('hidden');
    console.error('WebApp startup failure', error);
  }

  function flushAnalytics() {
    window.clearTimeout(state.analyticsTimer);
    const events = state.analyticsQueue.splice(0, 20);
    if (!events.length || isShared() || !state.bootstrap) return;
    RPC.call('recordAnalyticsEvents', events).catch(() => {});
    if (state.analyticsQueue.length) {
      state.analyticsTimer = window.setTimeout(flushAnalytics, 1200);
    }
  }

  function trackEvent(eventName, details = {}, durationMs = 0, status = 'success') {
    if (isShared()) return;
    state.analyticsQueue.push({
      eventAt: new Date().toISOString(),
      sessionId: state.sessionId,
      eventName: String(eventName || ''),
      route: state.route,
      panel: state.panel,
      scopeKey: state.scopeKey,
      durationMs: Number(durationMs || 0),
      status: status,
      details: details,
      userAgent: navigator.userAgent
    });
    if (state.analyticsQueue.length >= 10) flushAnalytics();
    else {
      window.clearTimeout(state.analyticsTimer);
      state.analyticsTimer = window.setTimeout(flushAnalytics, 5000);
    }
  }
  window.__RADAR_TELEMETRY__ = trackEvent;

  function setBusy(active) {
    state.pending = Math.max(0, state.pending + (active ? 1 : -1));
    $('app').setAttribute('aria-busy', String(state.pending > 0));
    $('scopeBar').classList.toggle('is-loading', state.pending > 0);
  }

  function deadline(promise, milliseconds, message) {
    return new Promise((resolve, reject) => {
      const timer = window.setTimeout(
        () => reject(Object.assign(new Error(message), { code: 'REQUEST_TIMEOUT' })),
        milliseconds
      );
      promise.then(
        value => {
          window.clearTimeout(timer);
          resolve(value);
        },
        error => {
          window.clearTimeout(timer);
          reject(error);
        }
      );
    });
  }

  function requestFor(panel = state.panel) {
    return ClientDomain.queryRequest({ ...state, panel });
  }

  function requestKey(request) {
    const scope = (state.bootstrap.scopes || []).find(
      item => item.scopeKey === request.scopeKey
    ) || {};
    return JSON.stringify({
      contract: state.bootstrap.app.contractVersion,
      cacheGeneration: state.bootstrap.app.cacheEpoch,
      scopeKey: request.scopeKey,
      scopeVersion: scope.dataVersion || state.bootstrap.app.dataVersion,
      snapshotId: scope.snapshotId || '',
      view: request.view,
      chartId: request.chartId,
      insightsId: request.insightsId,
      page: request.page,
      pageSize: request.pageSize,
      sortId: request.sortId
    });
  }

  function cacheKey(request) {
    return `dashboard:${requestKey(request)}`;
  }

  function schedulePreferenceSave() {
    if (isShared()) return;
    window.clearTimeout(state.preferenceTimer);
    const preference = {
      panel: state.panel,
      scopeKey: state.scopeKey,
      trendChart: state.trendChart,
      insightsId: state.insightsId,
      issuesView: state.issuesView
    };
    const signature = JSON.stringify(preference);
    if (signature === state.lastPreferenceSignature) return;
    state.preferenceTimer = window.setTimeout(() => {
      RPC.call('savePreference', 'dashboard_state', preference).then(() => {
        state.lastPreferenceSignature = signature;
      }).catch(() => {});
    }, 1500);
  }

  function setActionIcons() {
    const reports = document.querySelector('[data-route="reports"]');
    const ingest = document.querySelector('[data-route="import"]');
    const settings = document.querySelector('[data-route="settings"]');
    if (reports) reports.innerHTML = UI.icon('presentation');
    if (ingest) ingest.innerHTML = UI.icon('spherica-down-cloud');
    if (settings) settings.innerHTML = UI.icon('spherica-simulator');
    $('themeToggle').innerHTML = UI.icon(state.dark ? 'sun' : 'moon');
  }

  function syncNavigation() {
    document.querySelectorAll('[data-panel]').forEach(button => {
      button.classList.toggle(
        'workspace-tab-active',
        state.route === 'dashboard' && button.dataset.panel === state.panel
      );
    });
    document.querySelectorAll('[data-route]').forEach(button => {
      button.classList.toggle(
        'workspace-action-active',
        button.dataset.route === state.route
      );
    });
    setActionIcons();
  }

  function countryScopes(country) {
    return (state.bootstrap.scopes || []).filter(scope => scope.country === country);
  }

  function aggregateScope(scopes) {
    return scopes.find(scope => String(scope.scopeKey || '').endsWith('::*')) || null;
  }

  function syncScope() {
    const scopes = state.bootstrap.scopes || [];
    const active = currentScope() || scopes[0] || {};
    const countries = [...new Set(scopes.map(scope => scope.country).filter(Boolean))];
    $('workspaceCountry').innerHTML = countries.map(country => (
      `<option value="${UI.escape(country)}" ${country === active.country ? 'selected' : ''}>` +
      `${UI.escape(country)}</option>`
    )).join('') || '<option value="">Sin ámbitos publicados</option>';

    const related = countryScopes(active.country);
    const aggregate = aggregateScope(related);
    const individual = related.filter(scope => scope !== aggregate);
    const rollup = Boolean(aggregate && active.scopeKey === aggregate.scopeKey);
    $('workspaceRollup').checked = rollup;
    $('workspaceRollup').disabled = !isAdmin() || isShared() || !aggregate;
    $('workspaceSource').innerHTML = individual.map(scope => (
      `<option value="${UI.escape(scope.scopeKey)}" ` +
      `${scope.scopeKey === active.scopeKey ? 'selected' : ''}>` +
      `${UI.escape(scope.scopeLabel)}</option>`
    )).join('') || '<option value="">Sin vista por origen</option>';
    $('workspaceSource').disabled = !isAdmin() || isShared() || rollup || !individual.length;
    $('workspaceCountry').disabled = !isAdmin() || isShared();
    const sourceSlot = document.querySelector('.workspace-source-slot');
    sourceSlot.classList.toggle('hidden', rollup);
    sourceSlot.setAttribute('aria-hidden', String(rollup));
    $('workspaceRollupCaption').classList.toggle('hidden', !rollup);
    $('workspaceRollupCaption').textContent = rollup ? (active.scopeLabel || active.country) : '';
    const banner = $('sharedScopeBanner');
    banner.classList.toggle('hidden', !isShared());
    banner.textContent = isShared()
      ? `Vista compartida de solo lectura · ${active.scopeLabel || ''}`
      : '';
    $('scopeDescription').textContent = active.scopeLabel || active.country || 'Sin ámbito';
    $('dataVersion').textContent = active.activatedAt
      ? `Última importación: ${UI.formatDate(active.activatedAt)}`
      : 'Sin importación';
  }

  function bindIssueLinks() {
    document.querySelectorAll('.open-issue').forEach(button => {
      button.addEventListener('click', () => openIssue(button.dataset.uid));
    });
  }

  function renderMatrix(matrix) {
    if (!matrix || !Array.isArray(matrix.rows) || !matrix.rows.length) return '';
    return `<section class="surface-panel">
      <div class="panel-head">
        <div><p class="section-kicker">Distribución estática</p><h3>${UI.escape(matrix.title || 'Estado y prioridad')}</h3></div>
        <span class="metric-chip">${UI.formatNumber(matrix.total)} issues</span>
      </div>
      <div class="matrix-shell"><table class="matrix-table">
        <thead><tr><th>Estado</th>${(matrix.priorities || []).map(item =>
          `<th><span style="color:${UI.semanticCss(item.priority, 'priority')}">${UI.escape(item.priority)} (${UI.formatNumber(item.count)})</span></th>`
        ).join('')}</tr></thead>
        <tbody>${matrix.rows.map(row => `<tr>
          <th><span style="color:${UI.semanticCss(row.status)}">${UI.escape(row.status)} (${UI.formatNumber(row.count)})</span></th>
          ${(row.cells || []).map(cell => `<td>${UI.formatNumber(cell.count)}</td>`).join('')}
        </tr>`).join('')}</tbody>
      </table></div>
    </section>`;
  }

  function renderOverview() {
    const data = state.dashboard || {};
    const matrix = data.statusPriorityMatrix || data.matrix;
    Charts.begin(view());
    view().innerHTML = `<section class="page-stack">
      <section class="overview-kpi-grid">${(data.overviewKpis || []).map(item =>
        UI.kpi({
          ...item,
          value: /^\d+$/.test(String(item.value))
            ? UI.formatNumber(item.value)
            : item.value
        })
      ).join('')}</section>
      ${(data.focusCards || []).length ? `<section class="page-stack">
        <div class="panel-head"><div><h3>Focos accionables</h3></div></div>
        <div class="focus-card-grid">${data.focusCards.map(card =>
          `<article class="focus-card focus-card-${UI.escape(card.tone || 'neutral')}">
            <span class="focus-card-kicker">${UI.escape(card.kicker)}</span>
            <strong class="focus-card-metric">${UI.escape(card.metric)}</strong>
            <span class="focus-card-title">${UI.escape(card.title)}</span>
            <span class="focus-card-detail">${UI.escape(card.detail)}</span>
          </article>`
        ).join('')}</div>
      </section>` : ''}
      <section class="chart-grid overview-summary-grid">${(data.charts || []).map(chart =>
        `<article class="chart-card">
          <div class="chart-copy"><div><p class="eyebrow">${UI.escape(chart.group)}</p>
          <h4>${UI.escape(chart.title)}</h4><p>${UI.escape(chart.subtitle)}</p></div></div>
          ${Charts.placeholder(chart.figure, 320)}
        </article>`
      ).join('')}</section>
      ${renderMatrix(matrix)}
    </section>`;
    Charts.mountAll(view());
  }

  function renderTrends() {
    const data = (state.dashboard && state.dashboard.trends) || {};
    const catalog = data.chartCatalog || data.catalog || [];
    const chart = data.chart || {};
    Charts.begin(view());
    view().innerHTML = `<section class="page-stack">
      <section class="surface-panel trend-shell">
        <label class="field trend-selector-field"><span>Gráfico precalculado</span>
          <select id="trendChart">${catalog.map(item =>
            `<option value="${UI.escape(item.id)}" ${item.id === (data.selectedChartId || state.trendChart) ? 'selected' : ''}>` +
            `${UI.escape(item.title || item.label || item.id)}</option>`
          ).join('')}</select>
        </label>
        ${data.adaptedForTerminal ? '<p class="trend-inline-caption">Vista adaptada al estado finalista seleccionado: el gráfico conserva incidencias finalizadas para no perder señal.</p>' : ''}
        <section class="trend-chart-block">
          <div class="trend-chart-head"><div><p class="eyebrow">${UI.escape(chart.group)}</p>
          <h4>${UI.escape(chart.title)}</h4><p>${UI.escape(chart.subtitle)}</p></div></div>
          ${(data.metrics || []).length ? `<div class="trend-metric-strip">${data.metrics.map(metric =>
            `<article class="trend-metric-inline"><span>${UI.escape(metric.label)}</span><strong>${UI.escape(metric.value)}</strong></article>`
          ).join('')}</div>` : ''}
          <div class="trend-figure-shell">${Charts.placeholder(chart.figure, 380)}</div>
        </section>
        ${(data.sessionDelta || []).length ? `<section class="trend-copy-section"><h4>Qué cambió desde tu última sesión</h4><ul class="trend-delta-list">${data.sessionDelta.map(line => `<li>${UI.escape(line)}</li>`).join('')}</ul></section>` : ''}
        ${(data.cards || []).length ? `<section class="trend-copy-section">
          <h4>Insights accionables</h4>
          <div class="trend-action-grid">${data.cards.map(card =>
            `<article class="trend-action-card"><strong>${UI.escape(card.title)}</strong><span>${UI.escape(card.body)}</span>${issueList(card.issues || [], '')}</article>`
          ).join('')}</div>
        </section>` : ''}
        ${data.executiveTip ? `<p class="trend-executive-tip">${UI.escape(data.executiveTip)}</p>` : ''}
      </section>
    </section>`;
    const selector = $('trendChart');
    if (selector) selector.addEventListener('change', async event => {
      state.trendChart = event.target.value;
      trackEvent('trend_chart_selected', { chartId: state.trendChart });
      await refreshDashboard();
    });
    Charts.mountAll(view());
  }

  function issueList(rows, emptyText = 'No hay incidencias en este bloque.') {
    if (!Array.isArray(rows) || !rows.length) {
      return emptyText
        ? `<p class="issue-list-empty">${UI.escape(emptyText)}</p>`
        : '';
    }
    return `<div class="issue-stack">${rows.map(row =>
      `<article class="insight-issue-card">
        <div class="insight-issue-copy"><div class="issue-primary-link">${UI.issueKey(row)}
          <span class="issue-primary-link-title">${UI.escape(row.summary || 'Sin resumen')}</span></div>
        <div class="issue-card-badges insight-issue-chip-row">${UI.chip(row.status)} ${UI.chip(row.priority, 'priority')}
          ${row.assignee ? `<span class="issue-chip issue-chip-neutral">${UI.escape(row.assignee)}</span>` : ''}
          ${Number.isFinite(Number(row.ageDays)) ? `<span class="issue-chip issue-chip-neutral">${UI.formatNumber(Math.round(row.ageDays))}d</span>` : ''}
        </div></div>
      </article>`
    ).join('')}</div>`;
  }

  function renderInsightValue(value, label = '') {
    if (value == null || value === '') return '';
    if (Array.isArray(value)) {
      if (!value.length) return '';
      if (value.every(item => item && typeof item === 'object' && item.key)) {
        return issueList(value);
      }
      return `<div class="trend-action-grid">${value.slice(0, 80).map(item => {
        if (item && typeof item === 'object') {
          const title = item.title || item.label || item.name || item.functionality || item.status || '';
          const body = item.body || item.detail || item.brief || item.summary || item.value || item.count || '';
          return `<article class="trend-action-card"><strong>${UI.escape(title)}</strong><span>${UI.escape(body)}</span></article>`;
        }
        return `<article class="trend-action-card"><span>${UI.escape(item)}</span></article>`;
      }).join('')}</div>`;
    }
    if (typeof value === 'object') {
      if (value.figure) return Charts.placeholder(value.figure, 340);
      return Object.entries(value).map(([key, item]) => {
        if (['tabs', 'combo'].includes(key)) return '';
        const rendered = renderInsightValue(item, key);
        return rendered ? `<section class="surface-card"><h4>${UI.escape(key)}</h4>${rendered}</section>` : '';
      }).join('');
    }
    return `<p>${UI.escape(label ? `${label}: ${value}` : value)}</p>`;
  }

  function renderFunctionalityInsight(data) {
    const topics = data.topics || [];
    const tone = topic => {
      const priority = String(topic.dominantPriority || '').toLowerCase();
      if (priority === 'highest' || priority === 'high' || priority.includes('imped')) return 'risk';
      if (priority === 'medium') return 'warning';
      if (priority === 'low' || priority === 'lowest') return 'flow';
      return 'quality';
    };
    const flowLabel = direction => direction === 'improving' ? 'Mejorando' :
      direction === 'worsening' ? 'Empeorando' : 'Estable';
    return `<section class="page-stack">
      ${data.chart ? `<article class="chart-card trend-chart-card"><div class="chart-copy"><div>
        <p class="eyebrow">Insights</p><h4>${UI.escape(data.chart.title)}</h4><p>${UI.escape(data.chart.subtitle)}</p>
      </div></div>${data.chart.figure ? Charts.placeholder(data.chart.figure, 380) : '<p class="issue-list-empty">No hay histórico suficiente para construir la tendencia seleccionada.</p>'}</article>` : UI.empty('Sin tendencia disponible', 'No hay histórico suficiente para construir la tendencia seleccionada.')}
      ${topics.map(topic => `<details class="insight-detail-block topic-detail-block" data-tone="${tone(topic)}" style="--insight-accent:${UI.safeColor(topic.color)}">
        <summary><span class="topic-summary-copy"><span class="topic-summary-label">${UI.escape(topic.topic)}</span><span class="topic-summary-separator">:</span><span class="topic-summary-meta">${UI.formatNumber(topic.count)} ${Number(topic.count) === 1 ? 'incidencia' : 'incidencias'} - ${Number(topic.pct || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%</span></span></summary>
        <div class="topic-meta-row">${UI.chip(topic.dominantStatus)} ${UI.chip(topic.dominantPriority, 'priority')}</div>
        <p class="topic-brief">${UI.escape(topic.brief || '')}</p>
        ${topic.flow ? `<div class="flow-summary-card" data-tone="${tone(topic)}"><strong>${flowLabel(topic.flow.direction)}</strong><span>${UI.formatNumber(topic.flow.createdCount)} creadas · ${UI.formatNumber(topic.flow.resolvedCount)} resueltas · ${(Number(topic.flow.pctDelta || 0) * 100).toLocaleString('es-ES', { maximumFractionDigits: 1 })}% en ${UI.formatNumber(topic.flow.windowDays)} días</span></div>` : ''}
        ${(topic.rootCauses || []).length ? `<ul class="signal-list">${topic.rootCauses.map(cause => `<li>${UI.escape(cause.label)} · ${UI.formatNumber(cause.count)}</li>`).join('')}</ul>` : ''}
        ${issueList(topic.issues || [])}
      </details>`).join('')}
      ${data.tip ? `<p class="inline-caption">${UI.escape(data.tip)}</p>` : ''}
    </section>`;
  }

  function renderDuplicatesInsight(data) {
    const heuristic = state.duplicateMode === 'heuristic';
    const groups = heuristic ? (data.heuristicGroups || []) : (data.titleGroups || []);
    return `<section class="page-stack">
      ${data.brief ? `<p class="inline-caption">${UI.escape(data.brief)}</p>` : ''}
      <div class="soft-toggle-row"><button class="soft-toggle-button ${!heuristic ? 'soft-toggle-button-active' : ''}" data-duplicate-mode="title" type="button">Por título</button><button class="soft-toggle-button ${heuristic ? 'soft-toggle-button-active' : ''}" data-duplicate-mode="heuristic" type="button">Por heurística</button></div>
      ${groups.map(group => `<details class="insight-detail-block" data-tone="neutral">
        <summary><span>${UI.escape(group.summary || 'Grupo duplicado')}</span><strong>${UI.formatNumber(group.count)}</strong></summary>
        ${heuristic ? `<div class="topic-meta-row">${UI.chip(group.dominantStatus)} ${UI.chip(group.dominantPriority, 'priority')}</div>` : ''}
        ${issueList(group.issues || [])}
      </details>`).join('')}
    </section>`;
  }

  function renderFinalistInsight(data, rootCause) {
    return `<section class="page-stack">
      <section class="surface-panel finalist-hero-panel"><div><p class="section-kicker">${rootCause ? 'Labels JIRA / causa raíz' : 'Helix cerrado / JIRA pendiente'}</p><h3>${rootCause ? 'Evolutivos para solucionar causas raíces' : 'Impacto en backlog por estados finalistas'}</h3></div></section>
      <div class="ops-kpi-grid-react">${(data.kpis || []).map(item => `<article class="mini-kpi-card" data-tone="risk"><span>${UI.escape(item.label)}</span><strong>${UI.escape(item.value)}</strong><small>${UI.escape(item.detail)}</small></article>`).join('')}</div>
      ${(data.groups || []).map(group => `<details class="insight-detail-block finalist-discrepancy-block" data-tone="flow">
        <summary><span class="finalist-summary-main"><span class="finalist-summary-title">${group.helixUrl
          ? `<a class="issue-inline-link" href="${UI.escape(group.helixUrl)}" target="_blank" rel="noopener noreferrer">${UI.escape(group.helixId)}</a>`
          : UI.escape(group.helixId)}</span><span class="issue-chip finalist-helix-chip">Helix: ${UI.escape(group.helixStatus || '—')}</span></span><span class="finalist-summary-side"><strong>${UI.formatNumber(group.jiraCount)} JIRA</strong></span></summary>
        <div class="finalist-helix-description"><span>Helix</span><p>${UI.escape(group.helixText || group.helixSummary || 'Sin descripción Helix')}</p></div>

  async function openIssue(issueUid) {
    if (!issueUid) {
      UI.message('La incidencia no tiene una identidad unívoca en este snapshot.', 'error');
      return;
    }
    try {
      setBusy(true);
      const issue = isShared()
        ? await RPC.call('getSharedIssueDetail', state.sharedToken, issueUid)
        : await RPC.call('getIssueDetail', { scopeKey: state.scopeKey, issueUid });
      const root = $('issueDrawerRoot');
      root.innerHTML = `<aside class="issue-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
        <button id="drawerBackdrop" class="issue-drawer-backdrop" aria-label="Cerrar detalle" type="button"></button>
        <section class="issue-drawer-panel">

          <button id="drawerClose" class="ghost-button" type="button">Cerrar</button></div>
          <div class="issue-drawer-body">
            <div class="issue-card-meta">${UI.chip(issue.status)} ${UI.chip(issue.priority, 'priority')}

            </div>

  function reportSuccess(job) {
    const canSend = job.newsletterTested && !job.newsletterSent;
    const sendLabel = job.newsletterSent
      ? 'Newsletter enviada ✓'
      : 'Enviar newsletter';
    return `<div class="report-success">
      <strong>Presentación exacta publicada</strong>
      <span>${UI.formatNumber(job.slideCount)} diapositivas · ${UI.formatNumber(job.rowCount)} incidencias</span>
      <a href="${UI.escape(job.fileUrl)}" target="_blank" rel="noopener">Abrir en Google Slides ↗</a>
      <div class="newsletter-report-actions">
        <button id="testPeriodNewsletter" class="secondary-button" type="button">Probar newsletter</button>
        <button id="sendPeriodNewsletter" class="action-button" ${canSend ? '' : 'disabled'} type="button">${sendLabel}</button>
      </div>
      <small>${UI.formatNumber(job.recipientCount)} destinatarios activos. El envío final se habilita tras una prueba correcta al administrador conectado.</small>
    </div>`;
  }

  async function deliverNewsletter(mode) {
    const job = state.lastPeriodReport;
    if (!job) return;
    if (mode === 'send' && !window.confirm(
      'Se enviará la newsletter a todos los destinatarios activos de este ámbito. ¿Continuar?'
    )) return;
    const testButton = $('testPeriodNewsletter');
    const sendButton = $('sendPeriodNewsletter');
    if ((testButton && testButton.dataset.sending === '1') ||
        (sendButton && sendButton.dataset.sending === '1')) return;
    [testButton, sendButton].filter(Boolean).forEach(button => {
      button.disabled = true;
      button.dataset.sending = '1';
    });
    try {
      setBusy(true);
      const result = await deadline(
        RPC.call('sendPeriodNewsletter', job.reportId, mode),
        120000,
        'Gmail no respondió en 120 segundos.'
      );
      UI.message(
        mode === 'test'
          ? `Prueba enviada a ${result.testRecipient}.`
          : `Newsletter enviada a ${result.recipientCount} destinatarios.`,
        'success'
      );
      if (mode === 'send') job.newsletterSent = true;
      await renderReports();
    } catch (error) {
      UI.message(error.message, 'error');
    } finally {
      setBusy(false);
      [testButton, sendButton].filter(Boolean).forEach(button => {
        delete button.dataset.sending;
      });
    }
  }

  async function renderReports() {
    const epoch = state.navigationEpoch;
    view().innerHTML = `<section class="page-stack">
      <section class="surface-panel report-intro"><div>
        <p class="section-kicker">Reports</p><h3>Presentación y newsletter</h3>
        <p class="minor-copy">La publicación reutiliza el PPTX autoritativo del escritorio; GPC no vuelve a calcular ni reconstruir el informe.</p>
      </div></section>
      <section class="surface-panel"><div id="periodReportResult">Consultando snapshot…</div></section>
    </section>`;
    try {
      const status = await RPC.call('getPeriodReportStatus', state.scopeKey);
      if (epoch !== state.navigationEpoch || state.route !== 'reports') return;
      state.lastPeriodReport = status.job;
      $('periodReportResult').innerHTML = reportSuccess(status.job);
      $('testPeriodNewsletter').addEventListener('click', () => deliverNewsletter('test'));
      $('sendPeriodNewsletter').addEventListener('click', () => deliverNewsletter('send'));
    } catch (error) {
      if (epoch !== state.navigationEpoch || state.route !== 'reports') return;
      $('periodReportResult').innerHTML = `<p class="report-error">${UI.escape(error.message)}</p>`;
    }
  }

  const formatFileSize = value => {
    const bytes = Math.max(0, Number(value || 0));
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1048576) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1048576).toFixed(1)} MB`;
  };

  async function renderImport() {
    const epoch = state.navigationEpoch;
    const validation = state.transferValidation;
    const administration = state.bootstrap.administration || {};
    if (!administration.importReady) {
      view().innerHTML = `<section class="page-stack">
        <section class="surface-panel transfer-hero"><div class="transfer-hero-copy">
          <span class="transfer-eyebrow">Configuración obligatoria</span>
          <h2>Define primero la carpeta de informes</h2>
          <p>La ingesta permanece bloqueada hasta que exista una carpeta de Google Drive con permiso de escritura para conservar el PPTX y crear la presentación nativa.</p>
          <button id="openImportSettings" class="action-button" type="button">Abrir configuración</button>
        </div></section>
      </section>`;
      $('openImportSettings').addEventListener('click', async () => {
        state.navigationEpoch += 1;
        state.route = 'settings';
        syncNavigation();
        await renderSettings();
      });
      return;
    }
    view().innerHTML = `<section class="page-stack">
      <section class="surface-panel transfer-hero"><div class="transfer-hero-copy">
        <span class="transfer-eyebrow">Entrada controlada</span>
        <h2>Publicar snapshot del escritorio</h2>
        <p>Solo se admite el traslado .brr v3 con la proyección canónica y el PPTX exacto. La activación es atómica por ámbito.</p>
      </div></section>
      <section class="surface-panel page-stack">
        <form id="transferImportForm" class="upload-zone">
          <label for="transferFile"><strong>Seleccionar traslado .brr</strong><br>
          <small>Máximo ${Math.floor(Number(state.bootstrap.app.maxTransferBytes || 0) / 1048576)} MB.</small></label>
          <input id="transferFile" name="transferFile" type="file" accept=".brr,application/zip,application/octet-stream" required>
          <button id="validateTransfer" class="action-button" type="submit">Validar</button>
        </form>
        ${validation ? `<section class="transfer-result transfer-result-success">
          <strong>Verificación superada</strong>
          <p>${UI.escape(validation.summary)}</p>
          <small>${UI.escape(validation.fileName)} · ${formatFileSize(validation.fileSize)} · ${UI.escape(validation.scopeKey)}</small>
          <div class="transfer-action-row">
            <button id="cancelTransfer" class="ghost-button" type="button">Cancelar</button>
            <button id="commitTransfer" class="action-button" type="button">Publicar snapshot</button>
          </div>
        </section>` : ''}
      </section>
      <section class="surface-panel"><div class="panel-head"><div><p class="section-kicker">Trazabilidad</p><h3>Importaciones recientes</h3></div></div><div id="runsTable">Cargando…</div></section>
    </section>`;
    $('transferImportForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const file = $('transferFile').files[0];
      const maximum = Number(state.bootstrap.app.maxTransferBytes || 0);
      if (!file || !/\.brr$/i.test(file.name) || !file.size || (maximum && file.size > maximum)) {
        UI.message('Selecciona un traslado .brr válido.', 'error');
        return;
      }
      try {
        setBusy(true);
        if (state.transferValidation) {
          await RPC.call('cancelTransferImport', state.transferValidation.token);
        }
        state.transferValidation = await RPC.call('validateTransferImport', form);
        UI.message('Traslado verificado sin modificar el snapshot activo.', 'success');
        await renderImport();
      } catch (error) {
        UI.message(error.message, 'error');
      } finally {
        setBusy(false);
      }
    });
    if (validation) {
      $('cancelTransfer').addEventListener('click', async () => {
        await RPC.call('cancelTransferImport', validation.token);
        state.transferValidation = null;
        await renderImport();
      });
      $('commitTransfer').addEventListener('click', async () => {
        try {
          setBusy(true);
          const result = await RPC.call('commitTransferImport', validation.token);
          state.transferValidation = null;
          UI.message(result.summary, 'success');
          await boot();
        } catch (error) {
          UI.message(error.message, 'error');
        } finally {
          setBusy(false);
        }
      });
    }
    try {
      const runs = await RPC.call('listImportRuns');
      if (epoch !== state.navigationEpoch || state.route !== 'import') return;
      $('runsTable').innerHTML = runs.length
        ? `<div class="simple-table">${runs.map(run =>
          `<div class="simple-table-row"><span>${UI.escape(UI.formatDate(run.started_at))}</span><span>${UI.escape(run.file_name)}</span><span>${UI.chip(run.status)}</span></div>`
        ).join('')}</div>`
        : '<p>Sin importaciones registradas.</p>';
    } catch (error) {
      if (epoch !== state.navigationEpoch || state.route !== 'import') return;
      const table = $('runsTable');
      if (table) table.textContent = error.message;
    }
  }

  async function loadNewsletterSettings() {
    state.newsletterSettings = await RPC.call('getNewsletterSettings');

  function loadPickerLibrary() {
    return new Promise((resolve, reject) => {
      if (window.google && google.picker) return resolve();
      if (!window.gapi || typeof gapi.load !== 'function') {
        reject(new Error('Google Drive Picker no ha podido cargarse.'));
        return;
      }
      gapi.load('picker', {
        callback: resolve,
        onerror: () => reject(new Error('Google Drive Picker no ha podido cargarse.')),
        timeout: 10000,
        ontimeout: () => reject(new Error('Google Drive Picker ha agotado el tiempo de carga.'))
      });
    });
  }

  async function openDriveFolderPicker() {
    const button = $('openDrivePicker');
    if (button) {
      button.disabled = true;
      button.textContent = 'Abriendo Google Drive…';
    }
    try {
      const config = state.drivePickerConfig || await RPC.call('getDrivePickerConfig');
      state.drivePickerConfig = config;
      if (!config.configured) throw new Error(config.message);
      await loadPickerLibrary();
      const folderView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(true)
        .setMode(google.picker.DocsViewMode.LIST);
      const picker = new google.picker.PickerBuilder()
        .addView(folderView)
        .setOAuthToken(config.oauthToken)
        .setDeveloperKey(config.developerKey)
        .setAppId(config.appId)
        .setOrigin(google.script.host.origin)
        .setTitle('Selecciona la carpeta de informes')
        .setCallback(async data => {
          if (data.action !== google.picker.Action.PICKED || !data.docs || !data.docs[0]) return;
          try {
            const saved = await RPC.call('saveReportDriveFolder', data.docs[0].id);
            state.adminConsole = null;
            state.bootstrap.administration.reportDriveFolder = saved;
            state.bootstrap.administration.importReady = true;
            UI.message(`Carpeta «${saved.name}» seleccionada.`, 'success');
            await renderSettings();
          } catch (error) {
            UI.message(error.message, 'error');
          }
        })
        .build();
      picker.setVisible(true);
    } catch (error) {
      UI.message(error.message, 'error');
    } finally {

  async function setTheme(dark) {
    state.dark = Boolean(dark);
    document.documentElement.dataset.theme = state.dark ? 'dark' : 'light';
    setActionIcons();
    if (state.route === 'dashboard') renderCurrent();
    else if (state.route === 'settings') await renderSettings();
    if (!isShared()) {
      await RPC.call('savePreference', 'theme', state.dark ? 'dark' : 'light');
    }
  }

  async function fetchDashboard(request) {
    const key = requestKey(request);
    if (state.memory.has(key)) return state.memory.get(key);
    if (state.inFlight.has(key)) return state.inFlight.get(key);
    const persistent = await PersistentCache.read(cacheKey(request));
    if (persistent) {
      state.memory.set(key, persistent);
      return persistent;
    }
    const remote = deadline(
      isShared()
        ? RPC.call('querySharedDashboard', state.sharedToken, request)
        : RPC.call('queryDashboard', request),
      30000,
      'El snapshot no respondió en 30 segundos.'
    ).then(payload => {
      state.memory.set(key, payload);
      PersistentCache.write(cacheKey(request), payload).catch(() => {});
      return payload;
    }).finally(() => state.inFlight.delete(key));
    state.inFlight.set(key, remote);
    return remote;
  }

  async function refreshDashboard(expectedEpoch = state.navigationEpoch) {
    if (!state.scopeKey) {
      view().innerHTML = UI.empty(
        'No hay snapshots publicados',
        'Un administrador debe importar un traslado .brr v3 desde escritorio.'
      );
      return;
    }
    const request = requestFor();
    try {
      setBusy(true);
      const dashboard = await fetchDashboard(request);
      if (expectedEpoch !== state.navigationEpoch || state.route !== 'dashboard') return;
      state.dashboard = dashboard;
      state.route = 'dashboard';
      syncNavigation();
      renderCurrent();
    } catch (error) {
      view().innerHTML = UI.empty('No se pudo cargar el snapshot', error.message);
    } finally {
      setBusy(false);
    }
  }

  function showRouteLoading(label) {
    Charts.begin(view());
    view().innerHTML = `<section class="surface-panel app-loading route-loading">
      <div><div class="loading-spinner"></div><p>${UI.escape(label || 'Cargando sección…')}</p></div>
    </section>`;
  }

  function prefetchPrimaryViews() {
    if (!state.scopeKey) return;
    if (isShared()) {
      ['overview', 'insights', 'trends', 'issues'].forEach(panel => {
        fetchDashboard(requestFor(panel)).catch(() => {});
      });
      return;
    }
    const scopeAtStart = state.scopeKey;
    RPC.call('getDashboardViewBundle', scopeAtStart).then(entries => {
      if (scopeAtStart !== state.scopeKey) return;
      (entries || []).forEach(entry => {
        const request = entry.request || {};
        const key = requestKey(request);
        state.memory.set(key, entry.payload);
        PersistentCache.write(cacheKey(request), entry.payload).catch(() => {});
      });
    }).catch(() => {});
  }

  async function openPanel(panel) {
    const epoch = ++state.navigationEpoch;
    state.route = 'dashboard';
    state.panel = panel;
    state.page = 1;
    syncNavigation();
    const request = requestFor();
    const key = requestKey(request);
    let cached = state.memory.get(key);
    if (!cached) {
      cached = await PersistentCache.read(cacheKey(request));
      if (cached) state.memory.set(key, cached);
    }
    if (epoch !== state.navigationEpoch) return;
    if (cached) {
      state.dashboard = cached;
      renderCurrent();
    } else {
      showRouteLoading(`Abriendo ${panel === 'overview' ? 'Resumen' : panel === 'insights' ? 'Insights' : panel === 'trends' ? 'Tendencias' : 'Issues'}…`);
    }
    trackEvent('navigation', { target: panel });
    await refreshDashboard(epoch);
    schedulePreferenceSave();
  }

  async function boot() {
    document.body.className = 'auth-pending';
    $('accessGateMessage').textContent = 'Verificando identidad y snapshot…';
    try {
      const bootstrap = await deadline(
        isShared()
          ? RPC.call('getSharedBootstrap', state.sharedToken)
          : RPC.call('getBootstrap'),
        30000,
        'La aplicación no respondió en 30 segundos.'
      );
      state.bootstrap = bootstrap;
      const initial = bootstrap.initialState || {};
      state.scopeKey = initial.scopeKey || (bootstrap.scopes[0] && bootstrap.scopes[0].scopeKey) || '';
      state.panel = initial.panel || 'overview';
      state.trendChart = initial.trendChart || 'open_status_bar';
      state.insightsId = initial.insightsId || 'summary';
      state.issuesView = initial.issuesView === 'Table' ? 'Table' : 'Cards';
      state.pageSize = Number(initial.pageSize || 50);
      state.dark = (bootstrap.preferences.theme || 'light') === 'dark';
      state.lastPreferenceSignature = JSON.stringify({
        panel: state.panel,
        scopeKey: state.scopeKey,
        trendChart: state.trendChart,
        insightsId: state.insightsId,
        issuesView: state.issuesView
      });
      document.documentElement.dataset.theme = state.dark ? 'dark' : 'light';
      document.body.className = [
        'auth-ready',
        isShared() ? 'shared-view' : '',
        isAdmin() && !isShared() ? 'is-admin' : ''
      ].filter(Boolean).join(' ');
      $('appTitle').textContent = bootstrap.app.name;
      syncScope();
      syncNavigation();
      $('loadingView').classList.add('hidden');
      $('errorView').classList.add('hidden');
      view().classList.remove('hidden');
      if (bootstrap.dashboard && requestKey(requestFor()) === requestKey({
        ...requestFor(),
        view: initial.panel || 'overview'
      })) {
        state.dashboard = bootstrap.dashboard;
        state.memory.set(requestKey(requestFor()), bootstrap.dashboard);
        renderCurrent();
      } else {
        await refreshDashboard();
      }
      trackEvent('app_open', {
        role: bootstrap.user.role,
        shared: isShared(),
        dataVersion: bootstrap.app.dataVersion
      });
      window.setTimeout(prefetchPrimaryViews, 0);
      PersistentCache.prune({
        contract: bootstrap.app.contractVersion,
        cacheGeneration: bootstrap.app.cacheEpoch,
        dataVersion: bootstrap.app.dataVersion,
        scopeVersions: bootstrap.app.scopeVersions
      }).catch(() => {});
    } catch (error) {
      showAccessError(error);
    }
  }

  function bindShell() {
    document.querySelectorAll('[data-panel]').forEach(button => {
      button.addEventListener('click', () => openPanel(button.dataset.panel));
    });
    document.querySelectorAll('[data-route]').forEach(button => {
      button.addEventListener('click', async () => {
        if (!isAdmin() || isShared()) return;
        state.navigationEpoch += 1;
        state.route = button.dataset.route;
        syncNavigation();
        showRouteLoading('Abriendo sección de administración…');
        trackEvent('admin_navigation', { target: state.route });
        if (state.route === 'reports') await renderReports();
        else if (state.route === 'import') await renderImport();
        else await renderSettings();
      });
    });
    $('workspaceCountry').addEventListener('change', async event => {
      const epoch = ++state.navigationEpoch;
      const scopes = countryScopes(event.target.value);
      state.scopeKey = (aggregateScope(scopes) || scopes[0] || {}).scopeKey || '';
      state.page = 1;
      syncScope();
      await refreshDashboard(epoch);
      schedulePreferenceSave();
    });
    $('workspaceRollup').addEventListener('change', async event => {
      const epoch = ++state.navigationEpoch;
      const active = currentScope();
      const scopes = countryScopes(active.country);
      const aggregate = aggregateScope(scopes);
      const individual = scopes.find(scope => scope !== aggregate);
      state.scopeKey = event.target.checked && aggregate
        ? aggregate.scopeKey
        : (individual && individual.scopeKey) || (aggregate && aggregate.scopeKey) || '';
      state.page = 1;
      syncScope();
      await refreshDashboard(epoch);
      schedulePreferenceSave();
    });
    $('workspaceSource').addEventListener('change', async event => {
      const epoch = ++state.navigationEpoch;
      state.scopeKey = event.target.value;
      state.page = 1;
      syncScope();
      await refreshDashboard(epoch);
      schedulePreferenceSave();
    });
    $('themeToggle').addEventListener('click', () => setTheme(!state.dark));
    $('accessGateRetry').addEventListener('click', boot);
    $('retryButton').addEventListener('click', boot);
  }

  return {
    init() {
      try {
        assertShellContract();
        bindShell();
        window.addEventListener('error', event => {
          trackEvent('client_error', {
            message: String(event.message || 'Error de cliente'),
            source: String(event.filename || ''),
            line: Number(event.lineno || 0)
          }, 0, 'error');
        });
        window.addEventListener('unhandledrejection', event => {
          trackEvent('client_error', {
            message: String(event.reason && event.reason.message || event.reason || 'Promesa rechazada')
          }, 0, 'error');
        });
        window.addEventListener('pagehide', flushAnalytics);
        boot();
      } catch (error) {
        showAccessError(error);
      }
    }
  };
})();

window.addEventListener('DOMContentLoaded', App.init);
</script>
